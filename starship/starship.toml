"$schema" = 'https://starship.rs/config-schema.json'

# No blank line before each prompt (starship's default is true). Set back to
# true to restore the gap.
add_newline = false

format = """
$os\
$username\
$directory\
($git_branch$git_status[](fg:overlay))\
$fill\
$c\
$cpp\
$elixir\
$elm\
$golang\
$haskell\
$java\
$kotlin\
$julia\
$lua\
$nodejs\
$bun\
$deno\
$php\
$rust\
$scala\
$docker_context\
$conda\
$python\
$nix_shell\n  \
$character\
"""

palette = "rose-pine"

[palettes.rose-pine]
base = '#191724'
muted = '#6e6a86'
highlight_med = '#403d52'
highlight_high = '#524f67'
overlay = '#26233a'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'

[os]
disabled = false
format = "[ $symbol ]($style)[](fg:rose bg:highlight_high)"
style = "bg:rose fg:base"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
format = "[ $path ]($style)[](fg:highlight_med)"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[](fg:highlight_med bg:overlay)"
style = "bg:highlight_med fg:foam"
before_repo_root_style = "bg:highlight_med fg:foam"
repo_root_style = "bg:highlight_med fg:foam"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:overlay"
symbol = " "

[git_branch]
format = "[ $symbol $branch ]($style)"
style = "bg:overlay fg:foam"
symbol = " "

[git_status]
disabled = false
style = "bg:overlay fg:love"
format = '([$all_status$ahead_behind ]($style))'
up_to_date = '[ ✓ ](bg:overlay fg:iris)'
untracked = '[?\($count\)](bg:overlay fg:gold)'
stashed = '[\$](bg:overlay fg:iris)'
modified = '[!\($count\)](bg:overlay fg:gold)'
renamed = '[»\($count\)](bg:overlay fg:iris)'
deleted = '[✘\($count\)](bg:overlay fg:love)'
staged = '[++\($count\)](bg:overlay fg:gold)'
ahead = '[⇡\(${count}\)](bg:overlay fg:foam)'
diverged = '⇕[\[](bg:overlay fg:iris)[⇡\(${ahead_count}\)](bg:overlay fg:foam)[⇣\(${behind_count}\)](bg:overlay fg:rose)[\]](bg:overlay fg:iris)'
behind = '[⇣\(${count}\)](bg:overlay fg:rose)'

[time]
disabled = false
format = "[](fg:overlay)[ $time 󰴈 ]($style)"
style = "bg:overlay fg:rose"
time_format = "%I:%M%P"
use_12hr = true

[username]
disabled = false
format = "[ 󰧱 $user ]($style)[](fg:highlight_high bg:highlight_med)"
show_always = true
style_root = "bg:highlight_high fg:iris"
style_user = "bg:highlight_high fg:iris"

[character]
success_symbol = '[󱞪](fg:iris)'
error_symbol = '[󱞪](fg:love)'

