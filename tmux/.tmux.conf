set -g escape-time 10
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:rgb,screen*:title,rxvt*:ignorefkeys"
set -g allow-passthrough on

# Mouse: click to select panes, drag to select text, wheel to scroll into
# copy-mode. Apps that request their own mouse reporting (nvim with
# `mouse=a`, some TUI agent harnesses) still get raw events forwarded, so
# they keep working; hold Shift while selecting to force the terminal's own
# native selection instead of tmux/the app's.
set -g mouse on

# Vi-style copy-mode (h/j/k/l, v to start a selection, y to yank) to match
# nvim muscle memory.
set -g mode-keys vi

# Report focus in/out to the running program (nvim autoread, etc.)
set -g focus-events on

# More scrollback for long agent/build output.
set -g history-limit 50000

# Window names come from the running program. Claude Code's native installer
# symlinks `claude` to a binary named after its version
# (~/.local/share/claude/versions/2.1.281), and macOS names the process after
# that file, so the window showed "2.1.281". Show "claude" for any
# version-number name; everything else keeps tmux's default format.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'

# Copy destination for both `y` in copy-mode and mouse drag-select: relies
# on tmux's own OSC 52 relay (set-clipboard defaults to "external") to reach
# the local clipboard over SSH, but also pipes to a local clipboard tool
# when one is reachable (WSL's clip.exe, Wayland, X11, or macOS) as a
# belt-and-suspenders fallback for terminals that don't support OSC 52.
set -g @clipboard_cmd 'if [ -x /mnt/c/Windows/System32/clip.exe ]; then /mnt/c/Windows/System32/clip.exe; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; fi'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clipboard_cmd}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clipboard_cmd}"